server {
    listen 80;
    server_name localhost;

    # Maximum payload size for batch telemetry events
    client_max_body_size 10M;

    # 1. Reverse proxy all API and dynamic requests to FastAPI
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # Forward real client connection metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for streaming/live dashboards
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Production practice: Serve static assets directly from Nginx (bypasses Python)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}